<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#101827" />
  <meta name="description" content="NightMarket 台灣夜市互動圖台" />
  <title>NightMarket · 夜市圖台</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { theme: { extend: { fontFamily: { sans: ['DM Sans','ui-sans-serif','system-ui','sans-serif'], display: ['Plus Jakarta Sans','ui-sans-serif','system-ui','sans-serif'] } } } };
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@v9.2.4/ol.css" />
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/ol@v9.2.4/dist/ol.js"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    html, body, #root { margin: 0; min-height: 100%; height: 100%; }
    body { background:#eef2f7; color:#172033; font-family:'DM Sans',sans-serif; }
    .font-display { font-family:'Plus Jakarta Sans',sans-serif; }
    #map { height:100%; width:100%; }
    .ol-control { display:none; }
    .marker-pin { width:36px; height:36px; border:3px solid white; border-radius:50% 50% 50% 0; background:#f97316; box-shadow:0 7px 18px rgba(15,23,42,.28); transform:rotate(-45deg); transition:.2s; cursor:pointer; }
    .marker-pin::after { content:'N'; display:grid; place-items:center; height:100%; color:white; font:800 13px 'Plus Jakarta Sans'; transform:rotate(45deg); }
    .marker-pin.selected { width:44px; height:44px; background:#172033; box-shadow:0 0 0 7px rgba(249,115,22,.25),0 10px 24px rgba(15,23,42,.35); }
    .map-card { transition:transform .2s, box-shadow .2s, border-color .2s; }
    .map-card:hover { transform:translateY(-3px); box-shadow:0 14px 30px rgba(15,23,42,.14); }
    .map-card.selected { border-color:#fb923c; box-shadow:0 12px 26px rgba(249,115,22,.16); }
    .detail-panel { animation:panel-in .28s cubic-bezier(.23,1,.32,1); }
    @keyframes panel-in { from { opacity:0; transform:translateX(18px); } to { opacity:1; transform:none; } }
    .scrollbar-hide::-webkit-scrollbar { display:none; }
    .scrollbar-hide { scrollbar-width:none; -ms-overflow-style:none; }
    @media (max-width: 767px) { .detail-panel { animation:sheet-in .28s cubic-bezier(.23,1,.32,1); } @keyframes sheet-in { from { opacity:0; transform:translateY(18px); } to { opacity:1; transform:none; } } }
  </style>
</head>
<body>
  <div id="root"><div style="display:grid;place-items:center;height:100%;color:#64748b">NightMarket 圖台載入中…</div></div>
  <script>
    const { useEffect, useMemo, useRef, useState } = React;
    const h = React.createElement;
    const firebaseConfig = {
      apiKey: "AIzaSyD8rihVToD511YWZ62juqWstwg8wHOrF_4",
      authDomain: "webpage2-545e6.firebaseapp.com",
      projectId: "webpage2-545e6",
      storageBucket: "webpage2-545e6.firebasestorage.app",
      messagingSenderId: "966272045472",
      appId: "1:966272045472:web:dee262657f13d8328a54c5",
      measurementId: "G-98CSYWEKPC"
    };
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const COLLECTION = 'NightMarket';
    const DEFAULT_CENTER = [120.96, 23.7];

    const Icon = ({ name, size=18, stroke=1.8 }) => {
      const paths = {
        search: [h('circle',{key:'a',cx:11,cy:11,r:7}),h('path',{key:'b',d:'m20 20-4-4'})],
        locate: [h('circle',{key:'a',cx:12,cy:12,r:8}),h('path',{key:'b',d:'M12 2v3M12 19v3M2 12h3M19 12h3'})],
        layers: [h('path',{key:'a',d:'m12 3 9 5-9 5-9-5 9-5Z'}),h('path',{key:'b',d:'m3 12 9 5 9-5'}),h('path',{key:'c',d:'m3 16 9 5 9-5'})],
        mapPin: [h('path',{key:'a',d:'M20 10c0 5-8 11-8 11S4 15 4 10a8 8 0 1 1 16 0Z'}),h('circle',{key:'b',cx:12,cy:10,r:2.5})],
        arrow: [h('path',{key:'a',d:'m9 18 6-6-6-6'}),h('path',{key:'b',d:'M3 12h12'})],
        arrowLeft: [h('path',{key:'a',d:'m15 18-6-6 6-6'}),h('path',{key:'b',d:'M9 12h12'})],
        x: [h('path',{key:'a',d:'m6 6 12 12M18 6 6 18'})],
        compass: [h('circle',{key:'a',cx:12,cy:12,r:9}),h('path',{key:'b',d:'m15.5 8.5-2.1 4.9-4.9 2.1 2.1-4.9 4.9-2.1Z'})],
        external: [h('path',{key:'a',d:'M14 3h7v7M21 3l-9 9'}),h('path',{key:'b',d:'M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6'})]
      };
      return h('svg',{width:size,height:size,viewBox:'0 0 24 24',fill:'none',stroke:'currentColor',strokeWidth:stroke,strokeLinecap:'round',strokeLinejoin:'round','aria-hidden':'true'},paths[name] || paths.mapPin);
    };

    const recordFor = doc => {
      const d = doc.data() || {};
      return { firestoreId:doc.id, id:String(d.id || doc.id), name:String(d.name || '未命名夜市'), text:String(d.text || ''), img_url:String(d.img_url || ''), address:String(d.address || ''), lon:Number(d.lon || 0), lat:Number(d.lat || 0) };
    };

    function App() {
      const mapRef = useRef(null);
      const mapInstance = useRef(null);
      const vectorSource = useRef(null);
      const [markets, setMarkets] = useState([]);
      const [selected, setSelected] = useState(null);
      const [keyword, setKeyword] = useState('');
      const [status, setStatus] = useState('connecting');
      const [showPanel, setShowPanel] = useState(false);

      useEffect(() => {
        const unsubscribe = db.collection(COLLECTION).onSnapshot(snapshot => {
          const next = snapshot.docs.map(recordFor).filter(item => Number.isFinite(item.lon) && Number.isFinite(item.lat) && item.lon && item.lat).sort((a,b) => a.name.localeCompare(b.name,'zh-Hant'));
          setMarkets(next);
          setStatus('connected');
          setSelected(current => current && next.find(item => item.firestoreId === current.firestoreId) || next[0] || null);
        }, error => { console.error(error); setStatus('error'); });
        return unsubscribe;
      }, []);

      const filtered = useMemo(() => {
        const query = keyword.trim().toLowerCase();
        if (!query) return markets;
        return markets.filter(item => [item.name,item.address,item.text].some(value => value.toLowerCase().includes(query)));
      }, [markets, keyword]);

      useEffect(() => {
        if (!mapRef.current || mapInstance.current) return;
        vectorSource.current = new ol.source.Vector();
        const vectorLayer = new ol.layer.Vector({ source:vectorSource.current });
        const map = new ol.Map({ target:mapRef.current, layers:[new ol.layer.Tile({ source:new ol.source.OSM() }), vectorLayer], view:new ol.View({ center:ol.proj.fromLonLat(DEFAULT_CENTER), zoom:7.2, maxZoom:19 }), controls:[] });
        map.on('click', event => {
          const feature = map.forEachFeatureAtPixel(event.pixel, candidate => candidate);
          if (feature && feature.get('market')) { setSelected(feature.get('market')); setShowPanel(true); }
        });
        map.on('pointermove', event => { map.getTargetElement().style.cursor = map.hasFeatureAtPixel(event.pixel) ? 'pointer' : ''; });
        mapInstance.current = map;
        return () => { map.setTarget(null); mapInstance.current = null; };
      }, []);

      useEffect(() => {
        const source = vectorSource.current;
        const map = mapInstance.current;
        if (!source || !map) return;
        source.clear();
        map.getOverlays().clear();
        filtered.forEach(market => {
          const element = document.createElement('div');
          element.className = `marker-pin ${selected && selected.firestoreId === market.firestoreId ? 'selected' : ''}`;
          const overlay = new ol.Overlay({ element, positioning:'bottom-left', stopEvent:false, position:ol.proj.fromLonLat([market.lon,market.lat]) });
          overlay.set('market', market);
          map.addOverlay(overlay);
          element.addEventListener('click', event => { event.stopPropagation(); setSelected(market); setShowPanel(true); });
        });
        if (filtered.length) {
          const extent = ol.extent.boundingExtent(filtered.map(item => ol.proj.fromLonLat([item.lon,item.lat])));
          map.getView().fit(extent, { padding:[110,440,170,110], maxZoom:13, duration:450 });
        }
      }, [filtered, selected]);

      useEffect(() => { if (selected && mapInstance.current) mapInstance.current.getView().animate({ center:ol.proj.fromLonLat([selected.lon,selected.lat]), duration:350 }); }, [selected]);

      const resetView = () => {
        if (!mapInstance.current) return;
        if (!filtered.length) mapInstance.current.getView().animate({ center:ol.proj.fromLonLat(DEFAULT_CENTER), zoom:7.2, duration:500 });
        else { const extent = ol.extent.boundingExtent(filtered.map(item => ol.proj.fromLonLat([item.lon,item.lat]))); mapInstance.current.getView().fit(extent,{padding:[110,440,170,110],maxZoom:13,duration:500}); }
      };
      const selectMarket = market => { setSelected(market); setShowPanel(true); if (mapInstance.current) mapInstance.current.getView().animate({ center:ol.proj.fromLonLat([market.lon,market.lat]), zoom:Math.max(mapInstance.current.getView().getZoom(),11), duration:400 }); };
      const detail = selected ? h('div', { className:'detail-panel flex h-full flex-col' },
        h('div', { className:'relative h-52 shrink-0 overflow-hidden bg-slate-200' },
          selected.img_url ? h('img', { src:selected.img_url, alt:selected.name, className:'h-full w-full object-cover', onError:e => e.currentTarget.style.display='none' }) : null,
          h('div', { className:'absolute inset-0 bg-gradient-to-t from-[#101827]/80 via-transparent to-transparent' }),
          h('button', { className:'absolute right-4 top-4 rounded-full bg-black/25 p-2 text-white backdrop-blur transition hover:bg-black/45 md:hidden', onClick:() => setShowPanel(false), type:'button' }, h(Icon, { name:'x', size:18 })),
          h('div', { className:'absolute bottom-4 left-5 right-5' }, h('span', { className:'rounded-full border border-white/20 bg-white/15 px-2.5 py-1 text-[10px] font-bold uppercase tracking-[.14em] text-white backdrop-blur' }, '#' + selected.id))
        ),
        h('div', { className:'flex-1 overflow-y-auto p-5 sm:p-6' },
          h('p', { className:'text-[10px] font-bold uppercase tracking-[.18em] text-orange-500' }, 'Selected destination'),
          h('h2', { className:'mt-2 font-display text-2xl font-extrabold tracking-tight text-slate-900' }, selected.name),
          h('div', { className:'mt-5 space-y-3' }, [
            h('div', { key:'address', className:'flex items-start gap-3 rounded-xl bg-slate-50 p-3' }, h('div', { className:'mt-0.5 rounded-lg bg-orange-100 p-2 text-orange-600' }, h(Icon, { name:'mapPin', size:16 })), h('div', null, h('p', { className:'text-[10px] font-bold uppercase tracking-[.14em] text-slate-400' }, 'Address'), h('p', { className:'mt-1 text-sm leading-6 text-slate-700' }, selected.address || '地址尚未提供'))),
            h('div', { key:'coordinates', className:'flex items-start gap-3 rounded-xl bg-slate-50 p-3' }, h('div', { className:'mt-0.5 rounded-lg bg-sky-100 p-2 text-sky-600' }, h(Icon, { name:'compass', size:16 })), h('div', null, h('p', { className:'text-[10px] font-bold uppercase tracking-[.14em] text-slate-400' }, 'Coordinates'), h('p', { className:'mt-1 font-mono text-xs leading-6 text-slate-700' }, selected.lat.toFixed(5) + '° N', h('br'), selected.lon.toFixed(5) + '° E')))
          ]),
          h('div', { className:'mt-6' }, h('p', { className:'text-[10px] font-bold uppercase tracking-[.14em] text-slate-400' }, 'About this place'), h('p', { className:'mt-2 text-sm leading-7 text-slate-600' }, selected.text || '這個夜市還沒有詳細介紹。')),
          h('a', { href:'https://www.google.com/maps/search/?api=1&query=' + selected.lat + ',' + selected.lon, target:'_blank', rel:'noreferrer', className:'mt-7 inline-flex h-11 items-center justify-center gap-2 rounded-xl bg-[#172033] px-4 text-sm font-bold text-white transition hover:bg-orange-500' }, h(Icon, { name:'external', size:16 }), '在地圖中開啟')
        )
      ) : null;
      const cards = filtered.map(market => h('button', { key:market.firestoreId, className:'map-card ' + (selected && selected.firestoreId === market.firestoreId ? 'selected ' : '') + 'flex w-[220px] shrink-0 items-center gap-3 rounded-2xl border border-white/80 bg-white/95 p-2 text-left shadow-lg shadow-slate-900/8 backdrop-blur-xl', onClick:() => selectMarket(market), type:'button' }, [
        h('div', { className:'h-14 w-14 shrink-0 overflow-hidden rounded-xl bg-slate-100' }, market.img_url ? h('img', { src:market.img_url, alt:market.name, className:'h-full w-full object-cover', onError:e => e.currentTarget.style.display='none' }) : null),
        h('div', { className:'min-w-0 pr-2' }, [
          h('p', { key:'name', className:'truncate font-display text-xs font-extrabold text-slate-800' }, market.name),
          h('p', { key:'address', className:'mt-1 truncate text-[10px] text-slate-500' }, market.address || '地址尚未提供'),
          h('p', { key:'view', className:'mt-2 text-[9px] font-bold uppercase tracking-[.12em] text-orange-500' }, 'View details')
        ])
      ]));
      return h('main', { className:'relative h-full min-h-[640px] overflow-hidden bg-[#eef2f7]' }, [
        h('div', { key:'map', ref:mapRef, id:'map', className:'absolute inset-0' }),
        h('div', { key:'wash', className:'pointer-events-none absolute inset-0 bg-[linear-gradient(180deg,rgba(248,250,252,.86)_0%,transparent_18%,transparent_80%,rgba(15,23,42,.10)_100%)]' }),
        h('header', { key:'header', className:'pointer-events-none absolute left-0 right-0 top-0 z-20 flex items-start justify-between p-5 sm:p-7' }, [
          h('div', { key:'brand', className:'pointer-events-auto flex items-center gap-3 rounded-2xl border border-white/70 bg-white/90 px-3 py-2.5 shadow-lg shadow-slate-900/5 backdrop-blur-xl' }, [
            h('div', { key:'logo', className:'flex h-9 w-9 items-center justify-center rounded-xl bg-orange-500 font-display font-extrabold text-white shadow-lg shadow-orange-500/25' }, 'N'),
            h('div', { key:'brandtext' }, [h('div', { key:'title', className:'font-display text-sm font-extrabold tracking-tight text-slate-900' }, 'NIGHTMARKET'), h('div', { key:'subtitle', className:'text-[9px] font-bold uppercase tracking-[.2em] text-slate-400' }, 'Interactive map')])
          ]),
          h('div', { key:'actions', className:'pointer-events-auto flex items-center gap-2' }, [
            h('div', { key:'status', className:'hidden items-center gap-2 rounded-full border border-white/70 bg-white/90 px-3 py-2 text-xs font-semibold text-slate-600 shadow-lg shadow-slate-900/5 backdrop-blur-xl sm:flex' }, [h('span', { key:'dot', className:'h-1.5 w-1.5 rounded-full ' + (status === 'connected' ? 'bg-emerald-500' : 'bg-amber-500') }), status === 'connected' ? markets.length + ' 個夜市' : status === 'connecting' ? '資料載入中…' : '連線異常']),
            h('button', { key:'locate', className:'rounded-xl border border-white/70 bg-white/90 p-2.5 text-slate-600 shadow-lg shadow-slate-900/5 backdrop-blur-xl transition hover:text-orange-500', onClick:resetView, type:'button', 'aria-label':'重設地圖' }, h(Icon, { name:'locate', size:18 }))
          ])
        ]),
        h('div', { key:'search', className:'pointer-events-auto absolute left-5 top-[92px] w-[min(360px,calc(100vw-40px))] sm:left-7 sm:top-[105px]' }, h('div', { className:'relative rounded-xl border border-white/80 bg-white/92 shadow-lg shadow-slate-900/8 backdrop-blur-xl' }, [h('div', { key:'searchicon', className:'pointer-events-none absolute left-3 top-1/2 -translate-y-1/2 text-slate-400' }, h(Icon, { name:'search', size:16 })), h('input', { key:'input', value:keyword, onChange:e => setKeyword(e.target.value), className:'h-11 w-full rounded-xl bg-transparent pl-9 pr-3 text-xs font-medium text-slate-700 outline-none placeholder:text-slate-400', placeholder:'搜尋夜市名稱、地址…' })])),
        filtered.length > 0 ? h('div', { key:'cards', className:'scrollbar-hide pointer-events-auto absolute bottom-5 left-5 right-5 z-20 flex gap-3 overflow-x-auto pb-1 sm:bottom-7 sm:left-7 sm:right-auto sm:max-w-[calc(100vw-500px)]' }, cards) : null,
        selected ? h('aside', { key:'detail', className:(showPanel ? 'flex ' : 'hidden ') + 'pointer-events-auto absolute bottom-0 right-0 top-0 z-30 w-full flex-col bg-white shadow-2xl md:bottom-5 md:right-5 md:top-5 md:w-[380px] md:rounded-3xl md:border md:border-white/70' }, detail) : null,
        !markets.length ? h('div', { key:'empty', className:'pointer-events-auto absolute left-1/2 top-1/2 z-10 w-[min(380px,calc(100vw-40px))] -translate-x-1/2 -translate-y-1/2 rounded-3xl border border-white/70 bg-white/94 p-7 text-center shadow-xl backdrop-blur-xl' }, [
          h('div', { key:'emptyicon', className:'mx-auto flex h-14 w-14 items-center justify-center rounded-2xl bg-orange-50 text-orange-500' }, h(Icon, { name:'mapPin', size:24 })),
          h('h2', { key:'emptytitle', className:'mt-4 font-display text-lg font-extrabold text-slate-900' }, status === 'error' ? '無法連線圖台' : '等待夜市資料'),
          h('p', { key:'emptytext', className:'mt-2 text-sm leading-6 text-slate-500' }, status === 'error' ? '請確認 Firebase Firestore 權限與網路連線。' : '請先從後台新增含有經度與緯度的夜市資料。')
        ]) : null
      ]);
    }
    ReactDOM.createRoot(document.getElementById('root')).render(h(App));
  </script>
</body>
</html>
